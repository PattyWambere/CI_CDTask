<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC University - Contact</title>
</head>
<body style="margin:0;font-family:Arial,sans-serif;background:#f4f7fc;">

    <header style="background:#003366;color:white;padding:25px;text-align:center;">
        <h1>ABC University</h1>
    </header>

    <nav style="background:#00509e;padding:15px;text-align:center;">
        <a href="index.html" style="color:white;text-decoration:none;margin:15px;">Home</a>
        <a href="about.html" style="color:white;text-decoration:none;margin:15px;">About Us</a>
        <a href="courses.html" style="color:white;text-decoration:none;margin:15px;">Courses</a>
        <a href="contact.html" style="color:white;text-decoration:none;margin:15px;">Contact</a>
    </nav>

    <div style="max-width:700px;margin:40px auto;background:white;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);">

        <h2 style="color:#003366;text-align:center;">Contact Us</h2>

        <p><strong>Address:</strong> 123 University Road, Kigali, Rwanda</p>
        <p><strong>Phone:</strong> +250 123 456 789</p>
        <p><strong>Email:</strong> info@abcuniversity.edu</p>

        <h3 style="color:#00509e;">Send us a Message</h3>

        <form>
            <input type="text" placeholder="Your Name"
                style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;">

            <input type="email" placeholder="Your Email"
                style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;">

            <textarea placeholder="Your Message"
                style="width:100%;padding:10px;height:120px;border:1px solid #ccc;border-radius:5px;"></textarea>

            <br><br>

            <button type="submit"
                style="background:#00509e;color:white;border:none;padding:12px 20px;border-radius:5px;cursor:pointer;">
                Send Message
            </button>
        </form>

    </div>

    <footer style="background:#003366;color:white;text-align:center;padding:15px;">
        <p>&copy; 2026 ABC University. All Rights Reserved.</p>
    </footer>

</body>
</html>
